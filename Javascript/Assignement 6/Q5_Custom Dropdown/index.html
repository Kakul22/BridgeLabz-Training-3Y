<!DOCTYPE html>
<html>
<head>
    <title>Custom Dropdown</title>

    <style>
        body {
            font-family: Arial;
            padding: 50px;
        }

        #dropdown {
            position: relative;
            display: inline-block;
        }

        #dropdownButton {
            padding: 12px 25px;
            cursor: pointer;
        }

        #options {
            display: none;
            position: absolute;
            background-color: white;
            border: 1px solid black;
            width: 150px;
        }

        #options div {
            padding: 12px;
            cursor: pointer;
        }

        #options div:hover {
            background-color: lightblue;
        }

        #options.show {
            display: block;
        }
    </style>
</head>

<body>

    <h2>Custom Dropdown</h2>

    <div id="dropdown">

        <button id="dropdownButton">
            Select a Course
        </button>

        <div id="options">

            <div class="option">JavaScript</div>
            <div class="option">Python</div>
            <div class="option">Java</div>
            <div class="option">C++</div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
