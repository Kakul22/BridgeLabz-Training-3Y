<!DOCTYPE html>
<html>
<head>
    <title>Mouse Coordinates</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        #mouseBox {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            background-color: lightblue;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

    <h2>Mouse Coordinates Logger</h2>

    <p id="coordinates">Move your mouse inside the box.</p>

    <div id="mouseBox"></div>

    <script src="script.js"></script>

</body>
</html>
