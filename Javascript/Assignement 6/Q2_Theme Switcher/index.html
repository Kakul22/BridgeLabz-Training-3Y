<!DOCTYPE html>
<html>
<head>
    <title>Theme Switcher</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            transition: 0.3s;
        }

        body.light {
            background-color: white;
            color: black;
        }

        body.dark {
            background-color: #222;
            color: white;
        }

        body.blue {
            background-color: lightblue;
            color: darkblue;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body class="light" data-theme="light">

    <h2>Theme Switcher</h2>

    <p>Choose your preferred theme.</p>

    <button id="lightButton">Light</button>
    <button id="darkButton">Dark</button>
    <button id="blueButton">Blue</button>

    <p id="currentTheme">Current Theme: Light</p>

    <script src="script.js"></script>

</body>
</html>
