
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">

        <div class="card">

            <div class="front">
                <img src="webdevelopment.jpg" alt="Image">
                <h2>Web Development</h2>
            </div>

            <div class="back">
                <h2>About Web Development</h2>
                <p>
                    Web development is the process of creating
                    websites using HTML, CSS and other technologies.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
