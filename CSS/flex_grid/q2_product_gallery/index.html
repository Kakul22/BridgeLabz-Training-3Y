<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Product Gallery</h1>

    <div class="product-container">

        <div class="card">
            <img src="laptop.jpg" alt="Laptop">
            <h2>Laptop</h2>
            <p>₹55,000</p>
        </div>

        <div class="card">
            <img src="smartphone.jpg" alt="Smartphone">
            <h2>Smartphone</h2>
            <p>₹25,000</p>
        </div>

        <div class="card">
            <img src="headphones.webp" alt="Headphones">
            <h2>Headphones</h2>
            <p>₹2,500</p>
        </div>

        <div class="card">
            <img src="smartwatch.jpg" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p>₹4,000</p>
        </div>

        <div class="card">
            <img src="keyboard.jpg" alt="Keyboard">
            <h2>Keyboard</h2>
            <p>₹1,500</p>
        </div>

        <div class="card">
            <img src="mouse.jpg" alt="Mouse">
            <h2>Mouse</h2>
            <p>₹800</p>
        </div>

        <div class="card">
            <img src="tablet.jpg" alt="Tablet">
            <h2>Tablet</h2>
            <p>₹20,000</p>
        </div>

        <div class="card">
            <img src="speaker.jpg" alt="Speaker">
            <h2>Speaker</h2>
            <p>₹3,000</p>
        </div>

    </div>

</body>
</html>
