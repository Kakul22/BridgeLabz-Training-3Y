
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Height & Width Practice</h1>
    </header>

    <main>
        <section class="container">

            <div class="box box1">
                <h2>Box 1</h2>
                <p>200px × 150px</p>
            </div>

            <div class="box box2">
                <h2>Box 2</h2>
                <p>60% width</p>
            </div>

            <div class="box box3">
                <h2>Box 3</h2>
                <p>30vh height</p>
                <p class="long-text">
                    This text demonstrates overflow property.
                    The content is intentionally long so that
                    overflow can be observed inside the box.
                </p>
            </div>

        </section>
    </main>

</body>
</html>
