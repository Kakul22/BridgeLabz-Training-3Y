<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Form</title>
</head>
<body>
    <h1>Upload Image</h1>

    <form>

        <label for="image">Select an image:</label>
        <input 
            type="file" 
            id="image" 
            name="image" 
            accept=".jpg, .png">

        <p>
            Only JPG and PNG image files are allowed.
        </p>

        <input type="submit" value="Upload">

    </form>
</body>
</html>
