<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form page</title>
</head>
<body>
    <h1>Simple Form</h1>

    <!-- Form submits the data to result.html -->
    <form action="result.html" target="resultFrame">

        <label for="name">Enter Your Name:</label>
        <input type="text" id="name" name="name">

        <input type="submit" value="Submit">

    </form>

    <br>

    <!-- result.html will be displayed inside this iframe -->
    <iframe 
        name="resultFrame"
        width="500"
        height="200"
        title="Form Result">
    </iframe>
</body>
</html>
