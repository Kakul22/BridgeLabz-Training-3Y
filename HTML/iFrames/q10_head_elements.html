<!DOCTYPE html>
<html lang="en">

<head>

    <!-- The title appears on the browser tab -->
    <title>Important Head Elements</title>

    <!-- Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Provides a short description of the webpage -->
    <meta 
        name="description" 
        content="A webpage demonstrating important HTML head elements.">

    <!-- Specifies the author of the webpage -->
    <meta 
        name="author" 
        content="Kakul Mittal">

    <!-- Sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- CSS can be written inside this style element -->
    <style>
    </style>

    <!-- JavaScript can be written inside this script element -->
    <script>
    </script>

</head>

<body>

    <h1>Important Head Elements</h1>

    <p>
        This webpage demonstrates important elements
        that can be placed inside the HTML head section.
    </p>

</body>
</html>
