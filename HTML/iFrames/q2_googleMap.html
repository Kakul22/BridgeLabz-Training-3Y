<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map</title>
</head>
<body>
    <h1>My City - Mathura</h1>
    <!-- loading="lazy" means the map loads only when it is close to being visible -->
    <iframe
        src="https://www.google.com/maps?q=Mathura%20India&output=embed"
        title="Google Map showing Mathura"
        width="600"
        height="450">
    </iframe>
    
</body>
</html>
