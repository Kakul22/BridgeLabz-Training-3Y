<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mark tag</title>
</head>
<body>
    <p>
    My favorite subject is <mark>Programming</mark> because I enjoy solving
    problems and creating new applications.
    <small>Updated recently</small></p>
    <marquee>Welcome to My Web Page!</marquee>
    <marquee direction="up" >Welcome to My Web Page!</marquee>
    
</body>
</html>
